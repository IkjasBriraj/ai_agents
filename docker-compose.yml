version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senior_agent_app
    ports:
      - "8000:8000"
    environment:
      - USE_MONGODB=true
      - MONGODB_URL=mongodb://mongodb:27017/senior_agent
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: senior_agent_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
